<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!--
    The vault door glyph from src/render/icons.ts, path for path. Two things
    differ from the glyph, both because a tab draws this at 16px: the stroke
    is 1.75 rather than 1.5, which is the weight at which the teeth stay open
    and VP stays legible at 32 device pixels; and a light browser gets a
    darker amber, since #e3a63c on a white tab is about 2:1 and #9a6412 is
    5:1 on white and nearly 4:1 on an inactive grey tab. The PNGs beside this
    file are rendered from it by `node tools/make-icons.mjs`.
  -->
  <style>
    path { stroke: #e3a63c; }
    @media (prefers-color-scheme: light) { path { stroke: #9a6412; } }
  </style>
