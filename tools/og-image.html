<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vault Planner — social card source</title>
    <!--
      The source of site/og.png, rendered by tools/make-og.mjs. It is not
      part of the site: it lives here rather than in site/ precisely so the
      deploy does not publish it as a page of its own.

      1200x630 is the size every social platform crops from, and the reason
      this is a PNG at all -- an SVG og:image is ignored by most of them,
      Facebook, X and Slack included.

      The vault below is the same drawing as everywhere else: the geometry
      and colours of src/render/scene.ts at 1:1, with glyph paths from
      src/render/icons.ts. Nothing from the game is used here either.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=block"
    />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #0e1412; }
      .card {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        gap: 40px;
        padding: 64px;
        background: #0e1412;
        color: #dce5e0;
        font-family: Archivo, sans-serif;
      }
      .say { width: 500px; flex: none; }
      .eyebrow {
        margin: 0 0 24px;
        font-family: "JetBrains Mono", monospace;
        font-size: 15px;
        letter-spacing: 0.22em;
        color: #e3a63c;
      }
      h1 {
        margin: 0;
        font-size: 58px;
        font-weight: 700;
        line-height: 1.0;
        letter-spacing: -0.028em;
        color: #f1f6f3;
      }
      .lede {
        margin: 26px 0 0;
        font-size: 19px;
        line-height: 1.55;
        color: #b9c6c0;
      }
      .where {
        position: absolute;
        left: 64px;
        bottom: 56px;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        letter-spacing: 0.08em;
        color: #8b9a94;
      }
      /* The scene runs off the right edge on purpose: a card is a crop of
         something larger, and a vault that ends tidily inside the frame
         reads as a diagram rather than as a screen. */
      .scene { flex: none; margin-left: auto; margin-right: -110px; }
    </style>
  </head>
  <body>

      <div class="say">
        <p class="eyebrow">UNOFFICIAL &middot; FALLOUT SHELTER</p>
        <h1>Plan the vault before you dig.</h1>
        <p class="lede">
          Lay rooms out on the 26-cell grid across all 25 floors, and see at once
          what the game itself would not let you build.
        </p>
      </div>
      <p class="where">vault.shamahan.com</p>

        <text x="24" y="32" text-anchor="end" font-size="11" fill="#5d6c66">1</text>

        <g transform="translate(35 3)"><rect width="196" height="50" rx="3" fill="rgba(253,201,144,0.13)" stroke="#fdc990" stroke-width="1" /><use href="#glyph-vault_door" x="89.5" y="10.5" width="17" height="17" color="#fdc990" /><text x="98" y="39" text-anchor="middle" font-size="9" fill="#fdc990">Vault Door</text></g>

        <!-- Merged rooms, not single builds: at 9px a name like "Power
             Generator" is wider than the 64px a three-cell room gives it,

        <g transform="translate(255 3)"><rect width="196" height="50" rx="3" fill="rgba(227,166,60,0.13)" stroke="#e3a63c" stroke-width="1" /><use href="#glyph-bolt" x="89.5" y="10.5" width="17" height="17" color="#e3a63c" /><text x="98" y="39" text-anchor="middle" font-size="9" fill="#e3a63c">Power Generator</text></g>
